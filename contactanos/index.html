<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxSync</title>
    <link rel="icon" type="image/x-icon" href="../img/imagen-logo2-web.png" />
    <style>
      body {
        background-color: #f8fafc;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }
      /*Header*/
      .header {
        background-color: #ffffff;
        display: flex;
        top: 0;
        width: 100%;
        left: 0%;
        padding: 15px 40px;
        align-items: center;
        box-shadow: inset 0 5px 1.5cm rgba(0, 0, 0, 0.5);
        box-sizing: border-box; /* Asegura que el padding no deforme el ancho */
      }
      .div-contenedor {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .nav-menu {
        display: flex;
        gap: 35px;
        justify-content: left;
        align-items: center;
        font-family:
          Arial, Helvetica, sans-serif; /* SOLUCIÓN: Alinea verticalmente los textos y los botones */
      }
      .div-titulo {
        color: rgb(37, 99, 235);
        font-weight: bold;
      }
      .div-menu {
        display: flex;
        gap: 25px;
        margin-left: auto; /* SOLUCIÓN: Usa Flexbox para empujar el menú a la derecha de forma alineada */
        justify-content: center;
        align-items: center;
      }
      .lista-menu {
        list-style: none;
        margin: 0; /* SOLUCIÓN: Quita márgenes por defecto de las listas */
        padding: 0; /* SOLUCIÓN: Quita paddings por defecto de las listas */
      }
      .a-subrayado {
        text-decoration: none;
        cursor: pointer;
        color: gray;
      }
      .a-subrayado:hover {
        color: #007bff;
      }
      .boton-suscripcion {
        background-color: #eff6ff;
        border: #007bff solid 1px;
        border-radius: 1.5rem;
        padding: 5px 15px;
        font-weight: 700;
      }
      .boton-base-de-datos {
        border: #007bff solid 1px;
        border-radius: 0.5rem;
        color: #f88400;
        padding: 5px 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <header class="header">
        <div class="div-titulo">
          <h1>BoxSync</h1>
        </div>
        <div style="margin-right: 2rem">
          <h3 style="color: gray">|Plan de Suscripción</h3>
        </div>
        <div class="div-menu">
          <nav class="nav-menu">
            <li class="lista-menu">
              <a href="../index.html" class="a-subrayado">Dispositivo</a>
            </li>
            <li class="lista-menu">
              <a href="../historial_de_la_app/index.html" class="a-subrayado"
                >Historial App</a
              >
            </li>
            <li class="lista-menu">
              <a href="index.html" class="a-subrayado">Contáctanos</a>
            </li>
            <div class="boton-base-de-datos">
              <li class="lista-menu">
                <a href="../base_de_datos/index.html" class="a-subrayado"
                  >Base de Datos</a
                >
              </li>
            </div>
            <div class="boton-suscripcion">
              <li class="lista-menu">
                <a href="../plan_de_suscripcion/index.html" class="a-subrayado" style="color: #1d4ed8"
                  >Suscripción Activa</a
                >
              </li>
            </div>
          </nav>
        </div>
      </header>
    </header>
  </body>
</html>
